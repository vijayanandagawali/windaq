name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PRISMA_SCHEMA: services/wallet/prisma/schema.prisma

jobs:
  web:
    name: Web — typecheck, lint ratchet, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema "$PRISMA_SCHEMA"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (must not regress lint-baseline.json)
        run: node scripts/lint-ratchet.js
      - name: Build
        run: npm run build --workspace=frontend

  backend:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: windaq
          POSTGRES_PASSWORD: windaq_test
          POSTGRES_DB: windaq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windaq -d windaq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://windaq:windaq_test@localhost:5432/windaq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema "$PRISMA_SCHEMA"
      - name: Create schema
        run: npx prisma db push --schema "$PRISMA_SCHEMA" --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - name: Run backend tests
        run: npm run test:backend

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: windaq
          POSTGRES_PASSWORD: windaq_test
          POSTGRES_DB: windaq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windaq -d windaq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://windaq:windaq_test@localhost:5432/windaq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema "$PRISMA_SCHEMA"
      - name: Create schema
        run: npx prisma db push --schema "$PRISMA_SCHEMA" --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
