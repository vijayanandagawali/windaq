<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice">
  <style>
    .f{animation:fl 3.8s ease-in-out infinite}.f2{animation:fl 4.4s ease-in-out infinite reverse}
    .s{transform-box:fill-box;transform-origin:center;animation:sp 7s linear infinite}
    .g{animation:gl 3s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes sp{to{transform:rotate(360deg)}}
    @keyframes gl{0%,100%{opacity:.55}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.f,.f2,.s,.g{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F2A3D"/><stop offset=".55" stop-color="#0E4A4E"/><stop offset="1" stop-color="#0B5E46"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7D3A3"/><stop offset="1" stop-color="#C9AE72"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FCA5A5"/><stop offset=".45" stop-color="#DC2626"/><stop offset="1" stop-color="#7F1D1D"/></radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <ellipse class="g" cx="500" cy="-40" rx="620" ry="420" fill="url(#light)"/>
  <ellipse cx="500" cy="1060" rx="760" ry="420" fill="#12805C"/>
  <ellipse cx="500" cy="1060" rx="600" ry="330" fill="#169466" opacity=".7"/>
  <path d="M430 520 L570 520 L640 1000 L360 1000 Z" fill="url(#pitch)" opacity=".95"/>
  <g filter="url(#sh)">
    <rect x="466" y="470" width="12" height="120" rx="5" fill="#F8FAFC"/><rect x="494" y="470" width="12" height="120" rx="5" fill="#F8FAFC"/><rect x="522" y="470" width="12" height="120" rx="5" fill="#F8FAFC"/>
    <rect x="462" y="462" width="40" height="9" rx="4" fill="#FDE68A"/><rect x="498" y="462" width="40" height="9" rx="4" fill="#FDE68A"/>
  </g>
  <g class="f" transform="translate(300 330)">
    <g class="s"><circle r="78" fill="url(#ball)" filter="url(#sh)"/><path d="M-60 -48 C -20 -8, -20 8, -60 48" stroke="#FEE2E2" stroke-width="5" fill="none" stroke-dasharray="7 7"/><path d="M60 -48 C 20 -8, 20 8, 60 48" stroke="#FEE2E2" stroke-width="5" fill="none" stroke-dasharray="7 7"/></g>
  </g>
  <g class="f2" transform="translate(690 300)" filter="url(#sh)">
    <rect x="-95" y="-54" width="190" height="108" rx="26" fill="#FFFFFF"/>
    <circle cx="-45" cy="0" r="30" fill="#F59E0B"/><text x="-45" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#fff">C</text>
    <circle cx="40" cy="0" r="30" fill="#0EA5E9"/><text x="40" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#fff">VC</text>
  </g>
  <g transform="translate(500 800)" filter="url(#sh)">
    <rect x="-150" y="-38" width="300" height="76" rx="38" fill="#0F172A" opacity=".82"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#FDE68A" letter-spacing="2">11 · 100 CR</text>
  </g>
</svg>
