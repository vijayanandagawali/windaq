<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice">
  <style>
    .f{animation:fl 3.8s ease-in-out infinite}.f2{animation:fl 4.6s ease-in-out infinite reverse}
    .r{transform-box:fill-box;transform-origin:center;animation:rt 6s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes rt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    @media (prefers-reduced-motion:reduce){.f,.f2,.r{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#D1FAE5"/></linearGradient>
    <radialGradient id="pr" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#E5484D"/><stop offset="1" stop-color="#9B1C20"/></radialGradient>
    <radialGradient id="pg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#30A46C"/><stop offset="1" stop-color="#15603C"/></radialGradient>
    <radialGradient id="py" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#E8A800"/><stop offset="1" stop-color="#8A6200"/></radialGradient>
    <radialGradient id="pb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#3E63DD"/><stop offset="1" stop-color="#1D3A8F"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <g transform="translate(500 470) rotate(-10) translate(-300 -300)" filter="url(#sh)">
    <rect width="600" height="600" rx="44" fill="#fff"/>
    <rect x="18" y="18" width="224" height="224" rx="28" fill="#E5484D"/><rect x="58" y="58" width="144" height="144" rx="22" fill="#FDECEC"/>
    <rect x="358" y="18" width="224" height="224" rx="28" fill="#30A46C"/><rect x="398" y="58" width="144" height="144" rx="22" fill="#E6F6EC"/>
    <rect x="358" y="358" width="224" height="224" rx="28" fill="#E8A800"/><rect x="398" y="398" width="144" height="144" rx="22" fill="#FFF6D6"/>
    <rect x="18" y="358" width="224" height="224" rx="28" fill="#3E63DD"/><rect x="58" y="398" width="144" height="144" rx="22" fill="#E9EEFD"/>
    <g fill="none" stroke="#CBD5E1" stroke-width="2">
      <path d="M240 240h120v120H240z"/><path d="M240 280h120M240 320h120M280 240v120M320 240v120"/>
      <path d="M0 240h240M0 280h240M0 320h240M0 360h240M360 240h240M360 280h240M360 320h240M360 360h240"/>
      <path d="M240 0v240M280 0v240M320 0v240M360 0v240M240 360v240M280 360v240M320 360v240M360 360v240"/>
    </g>
    <path d="M40 280h200v40H40z" fill="#E5484D" opacity=".85"/><path d="M280 40h40v200h-40z" fill="#30A46C" opacity=".85"/>
    <path d="M360 280h200v40H360z" fill="#E8A800" opacity=".85"/><path d="M280 360h40v200h-40z" fill="#3E63DD" opacity=".85"/>
    <polygon points="240,240 300,300 240,360" fill="#E5484D"/><polygon points="240,240 360,240 300,300" fill="#30A46C"/>
    <polygon points="360,240 360,360 300,300" fill="#E8A800"/><polygon points="240,360 300,300 360,360" fill="#3E63DD"/>
  </g>
  <g class="f"><circle cx="300" cy="300" r="46" fill="url(#pr)"/><circle cx="300" cy="300" r="24" fill="none" stroke="#fff" stroke-width="6" opacity=".85"/></g>
  <g class="f2"><circle cx="720" cy="260" r="42" fill="url(#pg)"/><circle cx="720" cy="260" r="22" fill="none" stroke="#fff" stroke-width="6" opacity=".85"/></g>
  <g class="f2"><circle cx="760" cy="700" r="44" fill="url(#py)"/><circle cx="760" cy="700" r="23" fill="none" stroke="#fff" stroke-width="6" opacity=".85"/></g>
  <g class="f"><circle cx="250" cy="720" r="44" fill="url(#pb)"/><circle cx="250" cy="720" r="23" fill="none" stroke="#fff" stroke-width="6" opacity=".85"/></g>
  <g class="r" transform="translate(500 820)">
    <rect x="-70" y="-70" width="140" height="140" rx="30" fill="#fff" filter="url(#sh)"/>
    <g fill="#0F172A"><circle cx="-34" cy="-34" r="13"/><circle cx="34" cy="-34" r="13"/><circle cx="-34" cy="0" r="13"/><circle cx="34" cy="0" r="13"/><circle cx="-34" cy="34" r="13"/><circle cx="34" cy="34" r="13"/></g>
  </g>
</svg>
