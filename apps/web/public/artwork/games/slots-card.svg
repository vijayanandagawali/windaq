<svg data-wd-animated="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice">
  <style>
    .wd-float{animation:wdFloat 3.6s ease-in-out infinite}
    .wd-float2{animation:wdFloat 4.4s ease-in-out infinite reverse}
    .wd-spin{transform-box:fill-box;transform-origin:center;animation:wdSpin 14s linear infinite}
    .wd-spin-fast{transform-box:fill-box;transform-origin:center;animation:wdSpin 3s linear infinite}
    .wd-pulse{transform-box:fill-box;transform-origin:center;animation:wdPulse 2.4s ease-in-out infinite}
    .wd-bounce{animation:wdBounce 1.8s cubic-bezier(.3,0,.4,1) infinite}
    .wd-blink{animation:wdBlink 1.6s ease-in-out infinite}
    .wd-glow{animation:wdGlow 3s ease-in-out infinite}
    .wd-shine{animation:wdShine 6.5s ease-in-out infinite}
    @keyframes wdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes wdSpin{to{transform:rotate(360deg)}}
    @keyframes wdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    @keyframes wdBounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-38px)}55%{transform:translateY(0)}70%{transform:translateY(-12px)}85%{transform:translateY(0)}}
    @keyframes wdBlink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes wdGlow{0%,100%{opacity:.08}50%{opacity:.22}}
    @keyframes wdShine{0%{transform:translateX(-1100px)}40%,100%{transform:translateX(1600px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="curveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <radialGradient id="neonCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="ballGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <radialGradient id="ballRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="ballGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00A854"/>
    </radialGradient>
    <radialGradient id="ballBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </radialGradient>
    <radialGradient id="ballPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EA80FC"/>
      <stop offset="50%" stop-color="#AA00FF"/>
      <stop offset="100%" stop-color="#6A0080"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="dropGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="500" cy="500" r="450" fill="#FFB800" opacity="0.08" filter="url(#dropGlow)" class="wd-glow"/>

  <!-- Geometric Grid Texture -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
  </g>

  <!-- Game Specific Artwork Core -->
  
      <!-- Slot Machine Window -->
      <g transform="translate(500, 480)">
        <!-- Machine frame -->
        <rect x="-360" y="-280" width="720" height="560" rx="32" fill="#0b1b36" stroke="#FFB800" stroke-width="8" filter="url(#dropGlow)"/>
        <rect x="-330" y="-250" width="660" height="420" rx="20" fill="#050e1f" stroke="#1b355d" stroke-width="4"/>
        
        <!-- 3 Slot Reels -->
        <!-- Reel 1 -->
        <g class="wd-float"><rect x="-300" y="-220" width="180" height="360" rx="16" fill="#0a162b" stroke="#FFB800" stroke-width="3"/></g>
        <text x="-210" y="0" font-family="'Outfit', sans-serif" font-size="110" font-weight="900" fill="#FFB800" text-anchor="middle">7</text>
        <!-- Reel 2 -->
        <g class="wd-float" style="animation-delay:0.25s"><rect x="-90" y="-220" width="180" height="360" rx="16" fill="#0a162b" stroke="#00F0FF" stroke-width="3"/></g>
        <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="110" font-weight="900" fill="#FF3366" text-anchor="middle">7</text>
        <!-- Reel 3 -->
        <g class="wd-float" style="animation-delay:0.5s"><rect x="120" y="-220" width="180" height="360" rx="16" fill="#0a162b" stroke="#FFB800" stroke-width="3"/></g>
        <text x="210" y="0" font-family="'Outfit', sans-serif" font-size="110" font-weight="900" fill="#00FFA3" text-anchor="middle">7</text>
        
        <!-- Payline laser -->
        <g class="wd-blink"><line x1="-330" y1="-30" x2="330" y2="-30" stroke="#FFD700" stroke-width="6" stroke-dasharray="12,6"/></g>
        
        <!-- Jackpot Banner -->
        <g class="wd-pulse"><rect x="-220" y="200" width="440" height="60" rx="30" fill="url(#goldGradient)" stroke="#FFFFFF" stroke-width="2"/></g>
        <text x="0" y="242" font-family="'Outfit', sans-serif" font-size="32" font-weight="900" fill="#051329" text-anchor="middle" letter-spacing="4">MEGA JACKPOT</text>
      </g>
    
  <defs><linearGradient id="wdShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <g transform="rotate(18 500 500)"><rect class="wd-shine" style="animation-delay:0.8s" x="0" y="-400" width="260" height="1800" fill="url(#wdShine)"/></g>
</svg>
